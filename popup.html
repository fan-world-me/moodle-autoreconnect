<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── tokens (fan_world_me palette) ── */
  :root {
    --bg-body:      #040e16;
    --bg-glass:     rgba(6,20,36,0.72);
    --bg-input:     rgba(10,28,42,0.6);
    --border:       rgba(100,220,255,0.18);
    --border-hover: rgba(77,220,255,0.4);
    --text-primary: #e6f7ff;
    --text-sec:     #9fe8ff;
    --text-muted:   #6f8791;
    --cyan:         #00c8ff;
    --cyan-glow:    #00e5ff;
    --cyan-dim:     rgba(0,200,255,0.18);
    --grad:         linear-gradient(135deg,#7c3aed,#06b6d4);
    --red:          #ff4d6a;
    --red-dim:      rgba(255,77,106,0.12);
    --green:        #00e5b0;
    --blur:         blur(14px);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    width: 280px;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-body);
    color: var(--text-primary);
    padding: 0 0 4px;
    overflow-x: hidden;
  }

  /* animated bg blobs */
  body::before {
    content: '';
    position: fixed;
    inset: -50%;
    width: 200%; height: 200%;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(124,58,237,0.10) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(6,182,212,0.07) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── header ── */
  .header {
    position: relative;
    z-index: 1;
    background: rgba(8,24,40,0.6);
    backdrop-filter: var(--blur);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-icon {
    width: 32px; height: 32px;
    background: var(--grad);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    box-shadow: 0 0 14px rgba(0,200,255,0.2);
  }

  .header-text h1 {
    font-size: 13px; font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 0.01em;
    line-height: 1.2;
  }

  .header-text span {
    font-size: 10px; font-weight: 400;
    color: var(--text-muted);
  }

  /* ── status chip ── */
  .status-chip {
    position: relative; z-index: 1;
    margin: 12px 14px 0;
    padding: 10px 14px;
    background: var(--bg-glass);
    backdrop-filter: var(--blur);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex; align-items: center; gap: 10px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--text-muted);
    box-shadow: 0 0 6px currentColor;
    transition: background .3s, box-shadow .3s;
  }
  .status-dot.ok       { background: var(--cyan-glow); box-shadow: 0 0 8px var(--cyan-glow); }
  .status-dot.relogged { background: var(--green);     box-shadow: 0 0 8px var(--green); }
  .status-dot.error,
  .status-dot.logout   { background: var(--red);       box-shadow: 0 0 8px var(--red); }

  .status-info { flex: 1; min-width: 0; }
  .status-label {
    font-size: 11px; font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status-time { font-size: 10px; color: var(--text-muted); margin-top: 1px; }

  /* ── logout warn ── */
  .logout-warn {
    position: relative; z-index: 1;
    display: none;
    margin: 8px 14px 0;
    padding: 9px 12px;
    background: var(--red-dim);
    border: 1px solid rgba(255,77,106,0.3);
    border-radius: 12px;
    font-size: 10px; line-height: 1.5;
    color: #ffaab8;
  }

  /* ── section ── */
  .section {
    position: relative; z-index: 1;
    margin: 12px 14px 0;
  }

  .section-label {
    font-size: 9px; font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 8px;
  }

  /* ── toggle row ── */
  .toggle-row {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    background: var(--bg-glass);
    backdrop-filter: var(--blur);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .toggle-row:hover { border-color: var(--border-hover); background: rgba(77,220,255,0.06); }

  .toggle-text { flex: 1; min-width: 0; margin-right: 10px; }
  .toggle-name { font-size: 12px; font-weight: 500; color: var(--text-primary); line-height: 1.2; }
  .toggle-desc { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

  /* pill toggle */
  .pill { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
  .pill input { opacity:0; width:0; height:0; position:absolute; }
  .pill-track {
    position: absolute; inset: 0;
    background: rgba(111,135,145,0.35);
    border-radius: 20px; cursor: pointer;
    transition: background .2s;
  }
  .pill-track::before {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    left: 3px; top: 3px;
    background: #9fe8ff;
    border-radius: 50%;
    transition: transform .2s, background .2s;
  }
  .pill input:checked ~ .pill-track { background: rgba(0,229,255,0.35); }
  .pill input:checked ~ .pill-track::before { transform: translateX(16px); background: var(--cyan-glow); }

  /* ── inputs ── */
  .input-group { margin-bottom: 6px; }
  .input-label {
    font-size: 10px; font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 4px; display: block;
  }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 9px 12px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 12px; font-family: inherit;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus {
    border-color: rgba(0,200,255,0.45);
    box-shadow: 0 0 0 3px rgba(0,200,255,0.08);
  }

  /* ── save button ── */
  .btn-save {
    position: relative; z-index: 1;
    display: block; width: calc(100% - 28px);
    margin: 12px 14px 0;
    padding: 10px;
    background: var(--grad);
    border: none; border-radius: 12px;
    color: #fff; font-size: 12px; font-weight: 700;
    font-family: inherit; cursor: pointer;
    letter-spacing: 0.02em;
    box-shadow: 0 4px 20px rgba(0,200,255,0.15);
    transition: opacity .2s, box-shadow .2s, transform .1s;
  }
  .btn-save:hover  { opacity: .9; box-shadow: 0 4px 24px rgba(0,200,255,0.25); }
  .btn-save:active { transform: scale(.98); }

  /* ── links footer ── */
  .links-footer {
    position: relative; z-index: 1;
    margin: 12px 14px 10px;
    display: flex; gap: 6px; flex-wrap: wrap;
  }

  .link-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px;
    background: var(--bg-glass);
    backdrop-filter: var(--blur);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-sec);
    font-size: 10px; font-weight: 500;
    text-decoration: none;
    transition: border-color .2s, background .2s, color .2s;
    white-space: nowrap;
  }
  .link-chip:hover { border-color: var(--border-hover); color: var(--cyan-glow); background: var(--cyan-dim); }
  .link-chip svg  { flex-shrink: 0; opacity: .8; }

  .divider {
    position: relative; z-index: 1;
    border: none;
    border-top: 1px solid var(--border);
    margin: 12px 14px 0;
  }
</style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-icon">⚡</div>
    <div class="header-text">
      <h1>Moodle Auto-Relogin</h1>
      <span>moodle.econom.zp.ua</span>
    </div>
  </div>

  <!-- Status chip -->
  <div class="status-chip">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-info">
      <div class="status-label" id="statusLabel">Очікує перевірки</div>
      <div class="status-time"  id="statusTime"></div>
    </div>
  </div>

  <!-- Logout warning -->
  <div class="logout-warn" id="logoutWarn">
    ⚠ Ви вийшли вручну — авто-вхід призупинено.<br>
    Збережіть налаштування щоб відновити.
  </div>

  <!-- Toggles -->
  <div class="section">
    <div class="section-label">Налаштування</div>

    <label class="toggle-row" for="enabled">
      <div class="toggle-text">
        <div class="toggle-name">Увімкнено</div>
        <div class="toggle-desc">Тримати сесію живою</div>
      </div>
      <label class="pill">
        <input type="checkbox" id="enabled">
        <span class="pill-track"></span>
      </label>
    </label>

    <label class="toggle-row" for="autoReload">
      <div class="toggle-text">
        <div class="toggle-name">Авто-оновлення сторінки</div>
        <div class="toggle-desc">Перезавантажити одразу після релогіну</div>
      </div>
      <label class="pill">
        <input type="checkbox" id="autoReload">
        <span class="pill-track"></span>
      </label>
    </label>
  </div>

  <hr class="divider">

  <!-- Credentials -->
  <div class="section">
    <div class="section-label">Обліковий запис</div>
    <div class="input-group">
      <label class="input-label" for="user">Логін</label>
      <input type="text"     id="user" placeholder="логін Moodle" autocomplete="username">
    </div>
    <div class="input-group">
      <label class="input-label" for="pass">Пароль</label>
      <input type="password" id="pass" placeholder="••••••••"      autocomplete="current-password">
    </div>
  </div>

  <button class="btn-save" id="save">Зберегти</button>

  <hr class="divider">

  <!-- Links -->
  <div class="links-footer">
    <a href="https://fan-world-me.github.io/" target="_blank" rel="noopener" class="link-chip">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="0"/>
      </svg>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2a10 10 0 100 20A10 10 0 0012 2zm0 2c1.5 0 2.9.4 4.1 1.1L5.1 16.1A8 8 0 0114 4zm0 16c-1.5 0-2.9-.4-4.1-1.1l11-11A8 8 0 0112 20z"/>
      </svg>
      Сайт розробника
    </a>
    <a href="https://github.com/fan-world-me/moodle-autoreconnect" target="_blank" rel="noopener" class="link-chip">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor">

      </svg>
      Проєкт
    </a>
    <a href="https://github.com/fan-world-me" target="_blank" rel="noopener" class="link-chip">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      @fan-world-me
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
