<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; font-family: "Segoe UI", sans-serif; background:#0b1620; color:#e6f7ff; padding:14px; }
  h3 { margin:0 0 10px; font-size:14px; display:flex; align-items:center; gap:6px; }
  label { font-size:11px; color:#89cfe6; display:block; margin-bottom:4px; }
  input[type=text], input[type=password] {
    width:100%; box-sizing:border-box; padding:8px; margin-bottom:10px;
    background:rgba(10,28,42,0.6); border:1px solid rgba(77,220,255,0.25);
    border-radius:8px; color:#e6f7ff; font-size:12px;
  }
  .row { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .tog { position:relative; width:40px; height:22px; }
  .tog input { opacity:0; width:0; height:0; }
  .sl { position:absolute; inset:0; background:rgba(111,135,145,0.4); border-radius:22px; cursor:pointer; transition:.2s; }
  .sl:before { content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#9fe8ff; border-radius:50%; transition:.2s; }
  .tog input:checked + .sl { background:rgba(0,229,255,0.4); }
  .tog input:checked + .sl:before { transform:translateX(18px); background:#00e5ff; }
  button { width:100%; padding:9px; border:none; border-radius:8px; background:rgba(77,220,255,0.25);
    color:#e6f7ff; font-weight:600; cursor:pointer; font-size:12px; }
  button:hover { background:rgba(77,220,255,0.4); }
  #status { font-size:11px; margin-top:8px; text-align:center; color:#89cfe6; }
</style>
</head>
<body>
  <h3>⚡ Moodle Авто-реконект</h3>

  <div class="row">
    <span style="font-size:12px">Включено</span>
    <label class="tog">
      <input type="checkbox" id="enabled">
      <span class="sl"></span>
    </label>
  </div>

  <label for="user">Логін</label>
  <input type="text" id="user" placeholder="логін">

  <label for="pass">Пароль</label>
  <input type="password" id="pass" placeholder="••••••••">

  <button id="save">Зберегти</button>
  <div id="status">—</div>

  <script src="popup.js"></script>
</body>
</html>
